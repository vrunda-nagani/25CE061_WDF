<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <style>
         .box
    {
        width: 450px;;
        height:450 ;
        margin: 20px auto;
    }
    </style>
   <link rel="stylesheet" href="profile.css">
</head>
<body>
    <h1 align="center">profile page</h1>
<div class="photo">

        <h3>Profile Photo</h3>


        <div class="circle">

            <!-- Default Profile Logo -->

            <svg id="defaultProfile"
                 class="profile-placeholder"
                 xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 16 16">

                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>

                <path fill-rule="evenodd"
                      d="M8 9a5 5 0 0 0-5 5 .5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5 5 5 0 0 0-5-5z"/>

            </svg>


          

            <img id="preview"
                 src=""
                 alt="Profile Photo"
                 style="display:none;">

        </div>


        <br>


        <input
            type="file"
            id="profileImage"
            accept="image/*"
            onchange="loadImage(event)">

    </div>

    <fieldset class="box" >
        
        <form method="post">
            <table  cellspacing="20" align="center" >
                <tr align="left">
                    <th>Name</th>
                    <td>:</td>
                    <td><input type="text" placeholder="enter your name "required></td>
                </tr>
                <tr>
                    <th>Enrollment No.</th>
                    <td>:</td>
                    <td><input type="text" placeholder="enter your id"required></td>
                </tr>
            <tr align="left">
            <th>Department</th>
            <td>:</td>
            <td><input type="text" placeholder="enter your department"required></td>

            <tr align="left">
            <th>Semester</th>
            <td>:</td>
            <td><input type="text" placeholder="enter your semester"required></td>

            <tr align="left">
            <th>Email</th>
            <td>:</td>
            <td><input type="text" placeholder="enter your mail id"required></td>

            <tr align="left">
            <th>Mobile no.</th>
            <td>:</td>
            <td><input type="text" placeholder="enter your mobile number"required></td>

            <tr align="left">
            <th>Address</th>
            <td>:</td>
            <td><input type="text" placeholder="enter your Address"required></td>
           

            <tr align="center">
                
                <td><button type="submit">submit</button>
               <button type="reset">clear</button></td>
            </tr>


              
             </table>
             <h5 align="left"> click here to go on dashboard : <a href="dashboard.html">dashboard</a> </h5></td>
        </form>
        
    </fieldset>
    
</body>
</html>
